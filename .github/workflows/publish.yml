name: Publish episode

on:
  push:
    branches: [main]
    paths: ["episodes/*.md", ".github/workflows/publish.yml", "scripts/**"]
  workflow_dispatch:
    inputs:
      date:
        description: "Episode date to (re)build, e.g. 2026-10-07 (leave empty to just redeploy)"
        required: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency: publish

jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install tools
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q ffmpeg
          pip install -q edge-tts mutagen piper-tts

      - name: Find new episodes
        id: find
        run: |
          # Every script in episodes/ that isn't in the feed yet (normally today's
          # Morning Brief YYYY-MM-DD.md and Cyber Brief YYYY-MM-DD-cyber.md).
          # With a date input, rebuild that day's episodes instead.
          files=$(DATE_IN="${{ github.event.inputs.date }}" python3 -c "
          import json,glob,os
          d=os.environ.get('DATE_IN','').strip()
          if d:
              todo=[p for p in (f'episodes/{d}.md', f'episodes/{d}-cyber.md') if os.path.exists(p)]
          else:
              done={e['date'] for e in json.load(open('docs/episodes.json'))}
              todo=sorted(p for p in glob.glob('episodes/*.md') if os.path.basename(p)[:-3] not in done)
              newest=max((os.path.basename(p)[:10] for p in todo), default='')
              todo=[p for p in todo if os.path.basename(p).startswith(newest)]
          print(' '.join(todo))
          ")
          ids=$(for f in $files; do basename "$f" .md; done | tr '\n' ' ')
          days=$(for f in $files; do basename "$f" | cut -c1-10; done | sort -u | tr '\n' ' ')
          echo "Building: '$files'"
          echo "files=$files" >> "$GITHUB_OUTPUT"
          echo "ids=$ids" >> "$GITHUB_OUTPUT"
          echo "days=$days" >> "$GITHUB_OUTPUT"

      - name: Make audio and feed
        if: steps.find.outputs.files != ''
        env:
          TTS_VOICE: ${{ vars.TTS_VOICE }}
        run: |
          set -o pipefail
          python scripts/build.py ${{ steps.find.outputs.files }} 2>&1 | tee build.log

      - name: Store MP3s as releases
        if: steps.find.outputs.files != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for d in ${{ steps.find.outputs.ids }}; do
            gh release delete "ep-$d" --yes --cleanup-tag 2>/dev/null || true
            gh release create "ep-$d" "out/$d.mp3" --title "Morning Brief $d" --notes "Daily episode"
          done
          for old in $(cat out/dropped.txt); do
            gh release delete "ep-$old" --yes --cleanup-tag 2>/dev/null || true
          done

      - name: Save feed
        if: steps.find.outputs.files != ''
        run: |
          git config user.name "morning-brief-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs
          git commit -m "Publish ${{ steps.find.outputs.ids }}" || exit 0
          git pull --rebase
          git push

      - name: Assemble site (feed + audio)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p site/audio
          cp docs/* site/
          for d in $(python3 -c "import json;print(' '.join(e['date'] for e in json.load(open('docs/episodes.json'))))"); do
            if [ -f "out/$d.mp3" ]; then cp "out/$d.mp3" site/audio/;
            else gh release download "ep-$d" -p "*.mp3" -D site/audio --clobber; fi
          done
          ls -la site site/audio

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deploy
        uses: actions/deploy-pages@v4

      - name: Send WhatsApp recap
        if: steps.find.outputs.files != ''
        continue-on-error: true
        env:
          WHATSAPP_PHONE: ${{ secrets.WHATSAPP_PHONE }}
          CALLMEBOT_APIKEY: ${{ secrets.CALLMEBOT_APIKEY }}
        run: |
          for d in ${{ steps.find.outputs.days }}; do python scripts/whatsapp.py "$d"; done

      - name: Save error log
        if: failure()
        run: |
          git config user.name "morning-brief-bot"
          git config user.email "actions@users.noreply.github.com"
          git pull -q --rebase || true
          mkdir -p logs && (tail -60 build.log 2>/dev/null || echo "failed outside the audio step; see the Actions tab") > logs/last-error.txt
          git add logs && git commit -m "Build error log" && git push
